<!doctype html>
<html lang="en"><meta charset="utf-8"><title>GPUI + CEF</title>
<style>
* { box-sizing: border-box } body { margin: 0; background: #f3f6fb; color: #172439; font: 22px system-ui; padding: 64px }
small { color: #58708e; font-weight: 700; letter-spacing: 3px } h1 { font-size: 54px; margin: 20px 0 } p { max-width: 780px; line-height: 1.6; color: #52647d }
.cards { display: flex; gap: 16px; margin: 36px 0 } .card { border-radius: 16px; padding: 28px; color: white; width: 190px; font-weight: 700 }
.track { height: 12px; border-radius: 8px; background: #dae3ef; position: relative; max-width: 680px; overflow: hidden }
.dot { width: 64px; height: 12px; border-radius: 8px; background: #315cf5; animation: move 3s infinite alternate ease-in-out }
@keyframes move { from { transform: translateX(0) } to { transform: translateX(616px) } }
</style>
<small>LOCAL OFFLINE DEMO</small><h1>GPUI + CEF is painting.</h1>
<p>Chromium renders this HTML off-screen. Rust copies its BGRA pixels into a GPUI image. No web server or internet connection is needed.</p>
<div class="cards"><div class="card" style="background:#e53935">Red</div><div class="card" style="background:#209653">Green</div><div class="card" style="background:#2455d8">Blue</div></div>
<div class="track"><div class="dot"></div></div>
<p>Animation time: <strong id="timer">0.0</strong> seconds<br>This minimal demo is display-only.</p>
<script>const start = performance.now(); setInterval(() => { document.getElementById('timer').textContent = ((performance.now() - start) / 1000).toFixed(1); }, 100);</script>
</html>
